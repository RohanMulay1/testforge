name: ci

# The harness unit tests are fully offline (no Anthropic API key / no model calls),
# so CI can validate the deterministic logic — genome, metrics, the AST mutation
# engine, scoring, coverage selection, and reporting — on every push.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Run offline unit tests
        run: python -m pytest tests/ -q
